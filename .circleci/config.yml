defaults: &defaults
  working_directory: ~/app
  docker:
    - image: cimg/node:24.0
      auth:
        username: $DOCKER_USER
        password: $DOCKER_PASS

version: 2.1

workflows:
  version: 2.1
  ci-cd:
    jobs:
      - install:
          context: org-global
      - test:
          context: org-global
          requires:
            - install
      - testnode:
          context: org-global
          matrix:
            parameters:
              node-version: ["20.11", "22.11", "24.0", "current"]
      - publish:
          context: org-global
          requires:
            - test
            - testnode
      - glossary:
          context: org-global
          requires:
            - publish
          filters:
            branches:
              only:
                - master

jobs:
  install:
    <<: *defaults
    steps:
      - checkout
      - restore_cache:
          key: dependency-cache-{{ checksum "package.json" }}
      - run:
          name: Install dependencies
          command: npm i
      - save_cache:
          key: dependency-cache-{{ checksum "package.json" }}
          paths:
            - ./node_modules
  testnode:
    parameters:
      node-version:
        type: string
    working_directory: ~/app
    docker:
      - image: cimg/node:<< parameters.node-version >>
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    steps:
      - checkout
      - run: npm i
      - run: npm t
  test:
    <<: *defaults
    steps:
      - checkout
      - restore_cache:
          key: dependency-cache-{{ checksum "package.json" }}
      - run: npm t
      - run: npm run lint -- --plugin log
  publish:
    <<: *defaults
    steps:
      - checkout
      - restore_cache:
          key: dependency-cache-{{ checksum "package.json" }}
      - run:
          name: Set NPM tokens
          command: echo -e $NPMRC > ~/.npmrc
      - run:
          name: Publish to NPM
          command: npx published
  glossary:
    <<: *defaults
    steps:
      - run:
          name: Add to Glossary
          command: |
            curl --user ${CIRCLECI_API_TOKEN}: \
              --header "Content-Type: application/json" \
              --data "{\"build_parameters\":{\"TRIGGERING_REPOSITORY\":\"${CIRCLE_REPOSITORY_URL}\"}}" \
              --request POST \
              https://circleci.com/api/v1.1/project/github/fiverr/glossary/tree/master
